{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Fonts: Inter + EB Garamond -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<script type="application/ld+json">
{"@context":"https://schema.org","@type":"Person","name":"{{ site.author.name }}","url":"{{ site.url }}","email":"{{ site.author.email }}","jobTitle":"Independent Researcher, Trustworthy Medical Artificial Intelligence","alumniOf":["African Institute for Mathematical Sciences","Pan African University Institute for Basic Sciences, Technology and Innovation","Université de Kara"],"sameAs":["{{ site.author.googlescholar }}","{{ site.author.orcid }}","{{ site.author.researchgate }}","https://github.com/{{ site.author.github }}","https://www.linkedin.com/in/{{ site.author.linkedin }}"]}
</script>

<!-- Main stylesheet -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">
